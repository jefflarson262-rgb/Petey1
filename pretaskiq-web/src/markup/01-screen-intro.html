<!-- ═══════════════════════════════════════════════════════
     INTRO / DEMO CONTEXT SCREEN
══════════════════════════════════════════════════════════ -->
<div id="screen-intro" class="screen" style="background:#0A1520;min-height:100vh;">

  <!-- Demo top bar -->
  <div style="background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-size:15px;font-weight:800;color:#fff;font-family:'Space Grotesk',sans-serif;">PreTaskIQ</span>
      <span style="font-size:11px;font-weight:700;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);padding:2px 8px;border-radius:5px;letter-spacing:.06em;">GUIDED DEMO</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span style="font-size:12px;color:rgba(255,255,255,0.35);" id="demo-step-label">Step 1 of 10</span>
      <button onclick="exitDemo()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Exit demo</button>
    </div>
  </div>

  <!-- Progress bar -->
  <div style="height:3px;background:rgba(255,255,255,0.07);flex-shrink:0;">
    <div id="demo-progress" style="height:3px;background:var(--orange);transition:width 0.4s ease;width:10%;"></div>
  </div>

  <!-- Main content area -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;overflow-y:auto;">
    <div style="max-width:680px;width:100%;">

      <!-- Step visual area -->
      <div id="demo-visual" style="margin-bottom:32px;"></div>

      <!-- Narration bubble -->
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:22px 26px;margin-bottom:28px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <div id="demo-orb" style="width:32px;height:32px;border-radius:50%;background:#1A3050;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" fill="rgba(255,255,255,0.5)"/><path d="M5 11a7 7 0 0 0 14 0" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" fill="none" stroke-linecap="round"/><line x1="12" y1="18" x2="12" y2="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.3);">Petey</span>
          <span id="demo-speaking-badge" style="display:none;font-size:10px;font-weight:700;background:rgba(249,115,22,0.2);color:#FB923C;padding:2px 8px;border-radius:10px;">Speaking...</span>
        </div>
        <div id="demo-narration" style="font-size:16px;color:rgba(255,255,255,0.85);line-height:1.7;"></div>
      </div>

      <!-- Navigation -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <button id="demo-prev-btn" onclick="demoPrev()" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);border-radius:10px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">← Back</button>
        <div style="display:flex;gap:6px;" id="demo-dots"></div>
        <button id="demo-next-btn" class="btn-primary" onclick="demoNext()" style="padding:11px 28px;">Next →</button>
      </div>

    </div>
  </div>

  <div style="text-align:center;padding:12px;font-size:11px;color:rgba(255,255,255,0.2);flex-shrink:0;">PreTaskIQ — Provisional Patent Filed · Confidential</div>

</div>
