<!-- Onboarding screen — shown on first use to capture scope of work profile -->
<div id="screen-onboarding" class="screen anim-fade" style="display:none;">
  <div class="onboarding-wrap">
    <div class="onboarding-logo-row">
      <div class="logo-row" id="logo-onboarding"></div>
    </div>
    <div class="onboarding-progress-bar"><div id="onboarding-progress-fill" class="onboarding-progress-fill"></div></div>

    <div id="onboarding-step-display"></div>

    <div class="onboarding-nav">
      <button id="onboarding-back-btn" class="btn-secondary" style="visibility:hidden;">← Back</button>
      <button id="onboarding-next-btn" class="btn-primary" disabled>Next →</button>
    </div>
    <button id="onboarding-skip-btn" class="onboarding-skip-btn">Skip — use generic construction profile</button>
  </div>
</div>
