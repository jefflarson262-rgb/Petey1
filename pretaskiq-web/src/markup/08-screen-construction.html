<!-- ═══════════════════════════════════════════════════════
     CONSTRUCTION ADMIN SCREEN
══════════════════════════════════════════════════════════ -->
<div id="screen-construction" class="screen anim-fade" style="display:none;">
  <div class="cadmin-wrap">

    <!-- Header -->
    <div class="co-hero">
      <div class="co-photo" aria-hidden="true"></div>
      <div class="co-head">
        <div>
          <div class="co-label" id="cadmin-clock-label">Construction Admin</div>
          <div class="co-title"><span class="ov-slash" aria-hidden="true"><i></i><i></i></span>Project <em>Overview</em></div>
          <div class="co-sub">Documents, revisions and field coordination</div>
        </div>
        <div class="co-ask"><button class="talk-petey-btn" type="button" aria-label="Ask Petey" onclick="openAdminPetey()"><span class="talk-petey-face ask-petey-face"><img class="talk-petey-img" alt="" aria-hidden="true"></span><span class="talk-petey-text"><span class="talk-petey-name">Ask <em>Petey</em></span><span class="demo-petey-slash" aria-hidden="true"><i></i><i></i><i></i><b></b></span></span><svg class="demo-petey-chev" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg></button></div>
      </div>
    </div>

    <!-- Live roll-up of the job folders (filled in by 39-jobs.js) -->
    <div id="co-live" aria-live="polite"></div>

    <!-- Integration -->
    <div class="cadmin-section-title"><svg class="co-ico" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Integrations</div>
    <button class="cadmin-connect-btn">
      <span style="font-size:20px;">&#128279;</span>
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--navy);">Connect project management platform</div>
        <div style="font-size:11px;color:#999;margin-top:1px;">Sync drawings, RFIs and submittals automatically. Coming soon</div>
      </div>
    </button>

  </div>
</div>
